services:
  # ── PORTAL ACADÉMICO UNIFICADO (UN SOLO SERVICIO Y UN SOLO LINK) ──
  - type: web
    name: portal-academico
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portal-academico-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: BACKUP_DIR
        value: storage/backups
      - key: BACKUP_TIMEZONE
        value: America/Lima

databases:
  # ── BASE DE DATOS POSTGRESQL ──
  - name: portal-academico-db
    databaseName: portal_academico
    user: portal_user
    plan: free
    region: oregon
